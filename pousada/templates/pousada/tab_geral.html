<!-- 1. IDENTIDADE VISUAL -->
<div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
    <form method="POST" enctype="multipart/form-data" class="divide-y divide-slate-100">
        {% csrf_token %}
        <input type="hidden" name="acao" value="config_geral">
        
        <div class="p-6 md:p-8 space-y-6">
            <div class="flex items-center gap-3 pb-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-50 flex items-center justify-center text-indigo-600">
                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                </div>
                <div>
                    <h3 class="text-base font-bold text-slate-900">Informações Básicas</h3>
                    <p class="text-xs text-slate-500">O nome que identifica seu estabelecimento no AuraSaaS</p>
                </div>
            </div>

            <div>
                <label for="nome" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Nome da Pousada</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="hotel" class="w-4.5 h-4.5"></i>
                    </div>
                    <input type="text" name="nome" id="nome" value="{{ pousada.nome }}" required
                           class="block w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition-all text-sm font-medium">
                </div>
            </div>

            <div>
                <label for="whatsapp_recepcao" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">WhatsApp da Recepção</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="message-square" class="w-4.5 h-4.5"></i>
                    </div>
                    <input type="text" name="whatsapp_recepcao" id="whatsapp_recepcao" value="{{ pousada.whatsapp_recepcao|default:'' }}"
                           placeholder="Ex: 5511999999999"
                           class="block w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition-all text-sm font-medium">
                </div>
            </div>

            <div>
                <label for="prefixo_pin_padrao" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Prefixo Padrão da Senha (3 dígitos)</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="key-round" class="w-4.5 h-4.5"></i>
                    </div>
                    <input type="text" name="prefixo_pin_padrao" id="prefixo_pin_padrao" value="{{ pousada.prefixo_pin_padrao }}" required
                           maxlength="3" pattern="\d{3}" placeholder="Ex: 101"
                           class="block w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition-all text-sm font-medium">
                </div>
            </div>
        </div>

        <div class="p-6 md:p-8 space-y-6">
            <div class="flex items-center gap-3 pb-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-50 flex items-center justify-center text-indigo-600">
                    <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                </div>
                <div>
                    <h3 class="text-base font-bold text-slate-900">Logotipo Oficial</h3>
                    <p class="text-xs text-slate-500">Envie um logotipo oficial com fundo transparente</p>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-6 items-start">
                <div class="w-full md:w-48 flex-shrink-0 flex flex-col items-center justify-center p-4 rounded-xl border-2 border-dashed border-slate-200 bg-slate-50">
                    <span class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-3">Logo Atual</span>
                    <div class="w-28 h-28 bg-white rounded-lg shadow-sm border border-slate-200/60 p-2 flex items-center justify-center overflow-hidden">
                        {% if pousada.logo %}
                            <img id="logo-preview" src="{{ pousada.logo.url }}" alt="Logotipo" class="w-full h-full object-contain">
                        {% else %}
                            <div id="logo-preview-placeholder" class="flex flex-col items-center justify-center text-slate-400">
                                <i data-lucide="image" class="w-10 h-10 mb-1"></i>
                                <span class="text-xs">Sem logo</span>
                            </div>
                            <img id="logo-preview" src="" alt="Logotipo" class="w-full h-full object-contain hidden">
                        {% endif %}
                    </div>
                </div>

                <div class="flex-1 w-full">
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Escolher Nova Imagem</label>
                    <div class="relative group border border-slate-200 hover:border-indigo-400 rounded-xl overflow-hidden transition-all bg-slate-50 hover:bg-indigo-50/10 cursor-pointer">
                        <input type="file" name="logo" id="logo" accept="image/*"
                               class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                               onchange="previewImage(this)">
                        <div class="px-6 py-10 flex flex-col items-center justify-center text-center">
                            <i data-lucide="upload-cloud" class="w-8 h-8 text-indigo-500 mb-3 group-hover:scale-110 transition-transform"></i>
                            <p class="text-sm font-semibold text-slate-700">Clique para selecionar</p>
                            <p class="text-xs text-slate-400 mt-1">PNG ou JPG de até 5MB</p>
                            <span id="file-name" class="mt-3 text-xs font-medium text-indigo-600 hidden bg-indigo-50 px-2.5 py-1 rounded-full"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="p-6 md:p-8 bg-slate-50/50 flex justify-end">
            <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-600/20 transition-all flex items-center gap-2 border border-indigo-700">
                <i data-lucide="save" class="w-4 h-4"></i>
                Salvar Alterações
            </button>
        </div>
    </form>
</div>
