name: Deploy AuraSaaS to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 2.25.164.139
          username: wilian
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /apps/aurasaas
            git stash
            git pull origin main
            docker compose up -d --build
