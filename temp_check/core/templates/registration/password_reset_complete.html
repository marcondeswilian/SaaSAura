<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha Alterada - AuraSaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md border border-slate-200/80 p-8 text-center space-y-6">
        <!-- Success/Icon -->
        <div class="flex flex-col items-center">
            <div class="w-16 h-16 rounded-full bg-emerald-50 border border-emerald-100 flex items-center justify-center text-emerald-600 mb-4 shadow-sm">
                <i data-lucide="check-circle" class="w-8 h-8"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-900 tracking-tight">Senha Alterada com Sucesso!</h2>
            <p class="text-xs text-slate-500 mt-2 max-w-[285px] leading-relaxed">
                Sua credencial de acesso foi atualizada no AuraSaaS. Você já pode fazer login na sua conta com a nova senha cadastrada.
            </p>
        </div>

        <a href="/login/" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-600/15 transition-all flex items-center justify-center gap-2 border border-indigo-700 cursor-pointer">
            Ir para a Tela de Login
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
