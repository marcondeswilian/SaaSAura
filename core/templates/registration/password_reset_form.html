<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha - AuraSaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md border border-slate-200/80 p-8 space-y-6">
        <!-- Brand/Icon -->
        <div class="flex flex-col items-center text-center">
            <div class="w-12 h-12 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600 mb-4 shadow-sm">
                <i data-lucide="key-round" class="w-6 h-6"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-900 tracking-tight">Esqueceu sua senha?</h2>
            <p class="text-xs text-slate-500 mt-1.5 max-w-[280px]">Não se preocupe! Insira o e-mail cadastrado abaixo para redefinir sua credencial.</p>
        </div>

        <!-- Form -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_email" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Endereço de E-mail *</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="mail" class="w-4.5 h-4.5"></i>
                    </div>
                    <input type="email" name="email" id="id_email" required placeholder="dono@pousada.com"
                           class="block w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition-all text-sm font-medium">
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-600/15 transition-all flex items-center justify-center gap-2 border border-indigo-700 cursor-pointer">
                Enviar E-mail de Redefinição
            </button>
        </form>

        <div class="border-t border-slate-100 pt-4 text-center">
            <a href="/login/" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-colors">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Voltar ao Login
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
